<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOKYO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04070F">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=20261122">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=20261122">
<style>
  :root{--or:#F2C08A;--doux:rgba(247,243,236,.5);--ease:cubic-bezier(.16,.8,.2,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04070F}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#F7F3EC;-webkit-font-smoothing:antialiased;overflow:hidden}
  .scene{position:relative;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
  canvas#topo{position:absolute;inset:0;width:100%;height:100%;display:block;background:#04070F}
  .voile{position:absolute;inset:0;pointer-events:none;background:
    linear-gradient(0deg,rgba(4,7,15,.85) 0%,rgba(4,7,15,0) 26%),
    linear-gradient(180deg,rgba(4,7,15,.45) 0%,rgba(4,7,15,0) 16%)}
  .grain{position:absolute;inset:-50%;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain 1s steps(4) infinite}
  @keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
  .masque{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  header{position:relative;z-index:3;display:flex;justify-content:flex-end;padding:24px clamp(18px,4vw,56px) 0}
  .langue{display:flex;gap:2px;font-size:11.5px;letter-spacing:.18em}
  .langue button{background:none;border:0;color:var(--doux);cursor:pointer;padding:6px 8px;font:inherit}
  .langue button[aria-pressed="true"]{color:#fff;font-weight:600}
  .apparait{opacity:0;transform:translateY(10px);animation:monte 1.8s var(--ease) forwards}
  @keyframes monte{to{opacity:1;transform:none}}

  footer{grid-row:3;position:relative;z-index:3;padding:20px clamp(18px,4vw,56px) max(22px,env(safe-area-inset-bottom));font-size:11px;line-height:1.75;letter-spacing:.04em;color:var(--doux);text-align:center}
  footer b{color:rgba(247,243,236,.85);font-weight:600;letter-spacing:.08em}
  footer a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(242,192,138,.55);padding-bottom:1px}
  footer .sep{opacity:.45;margin:0 .55em}
  [data-lang]{display:none}
  html[lang="fr"] [data-lang="fr"],html[lang="en"] [data-lang="en"]{display:inline}
  @media (max-width:700px){
    footer{font-size:10px;line-height:1.6}
    footer .bl{display:block}
    footer > .sep,footer .br{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>
<div class="scene">
  <canvas id="topo" aria-hidden="true"></canvas>
  <div class="voile"></div>
  <div class="grain" aria-hidden="true"></div>
  <h1 class="masque">GOKYO</h1>

  <header>
    <nav class="langue apparait" style="animation-delay:5.6s" aria-label="Langue / Language">
      <button type="button" data-set="fr" aria-pressed="true">FR</button>
      <button type="button" data-set="en" aria-pressed="false">EN</button>
    </nav>
  </header>

  <footer class="apparait" style="animation-delay:6s">
    <span class="bl"><b>GOKYO S.à r.l.-S</b></span><span class="sep">·</span><span class="bl"><span data-lang="fr">Société à responsabilité limitée simplifiée de droit luxembourgeois</span><span data-lang="en">Simplified limited liability company under Luxembourg law</span></span><span class="sep">·</span><span class="bl">131, rue de Hollerich, L-1741 Luxembourg</span><br class="br">
    <span class="bl"><span data-lang="fr">RCS Luxembourg</span><span data-lang="en">Luxembourg Trade and Companies Register</span> B239634</span><span class="sep">·</span><span class="bl"><span data-lang="fr">TVA</span><span data-lang="en">VAT</span> LU31725054</span><span class="sep">·</span><span class="bl"><a href="mailto:contact@gokyo.lu">contact@gokyo.lu</a><span class="sep">·</span>© 2026</span>
  </footer>
</div>
<script>
(function(){
  "use strict";
  /* ---------- Langue ---------- */
  var html=document.documentElement, btns=document.querySelectorAll('[data-set]');
  function set(l){ html.lang=l; for(var i=0;i<btns.length;i++){btns[i].setAttribute('aria-pressed', String(btns[i].getAttribute('data-set')===l));} try{localStorage.setItem('lang',l);}catch(e){} }
  var l=null; try{l=localStorage.getItem('lang');}catch(e){}
  if(l!=='fr'&&l!=='en'){ l=((navigator.language||'fr').slice(0,2).toLowerCase()==='fr')?'fr':'en'; }
  set(l);
  for(var b=0;b<btns.length;b++){btns[b].addEventListener('click',function(){set(this.getAttribute('data-set'));});}

  /* ---------- Massif en 3D avec ses courbes de niveau (WebGL) ----------
     1) Vue du dessus : les courbes apparaissent, l'aube éclaire les sommets puis descend.
     2) Une fois tout éclairé, la caméra descend et s'incline vers la montagne.
     3) Puis elle tourne lentement autour du sommet, objectif toujours dirigé vers lui. */
  var cv=document.getElementById('topo');
  var gl=cv.getContext('webgl2',{antialias:false,alpha:false});
  var v2=!!gl;
  if(!gl){ gl=cv.getContext('webgl',{antialias:false,alpha:false}); if(!gl || !gl.getExtension('OES_standard_derivatives')) return; }

  var VS = v2 ? '#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'
              : 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  var FS = (v2 ? '#version 300 es\nprecision highp float;out vec4 o;\n#define FRAG o\n'
               : '#extension GL_OES_standard_derivatives : enable\nprecision highp float;\n#define FRAG gl_FragColor\n') + [
    'uniform vec2 R;uniform float T;uniform vec2 M;',
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);',
    ' return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y);}',
    'float ridged(vec2 p){float s=0.,a=.55,w=1.;mat2 r=mat2(.8,-.6,.6,.8);',
    ' for(int i=0;i<6;i++){float n=1.-abs(vn(p)*2.-1.);n*=n;n*=w;w=clamp(n*1.8,0.,1.);s+=n*a;a*=.5;p=r*p*2.03+3.1;}return s;}',
    'float H(vec2 p){',
    ' float d=length(p*vec2(1.,1.15));',
    ' float massif=exp(-d*d*1.35);',
    ' vec2 q1=p-vec2(-1.05,.45),q2=p-vec2(1.25,-.55);',
    ' float second=exp(-dot(q1,q1)*2.6)*.55+exp(-dot(q2,q2)*2.2)*.5;',
    ' float r=ridged(p*1.25);',
    ' return massif*1.05+second+r*.55*(.45+massif)-.12;}',
    'const float EX=.62;',                                                // exagération du relief
    'float Z(vec2 p){return H(p)*EX;}',
    'vec3 ciel(vec3 d,float aube){',
    ' float e=d.z;',
    ' vec3 c=mix(vec3(.10,.07,.11),vec3(.012,.02,.05),smoothstep(-.02,.45,e));',
    ' vec3 sd=normalize(vec3(.75,.35,.10));float s=max(dot(d,sd),0.);',
    ' c+=vec3(1.,.55,.30)*pow(s,10.)*.55*aube;',
    ' c+=vec3(1.,.45,.28)*exp(-max(e,0.)*9.)*.22*aube*(.4+.6*s);',
    ' return c;}',
    'void main(){',
    ' vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);',
    // --- caméra ---
    ' float k=smoothstep(10.,18.,T);',                                     // descente / inclinaison
    ' float th=1.16*k*(1.-(clamp(R.y/R.x,1.,2.4)-1.)*.17);',                                                   // angle depuis la verticale
    ' float s0=T<11.?0.:(T<21.?(T-11.)*(T-11.)/20.:5.+(T-21.));',          // la rotation démarre en douceur
    ' float az=.35+T*.006+s0*.105+M.x*.25;',                               // un tour ≈ 1 min
    ' float por=clamp(R.y/R.x,1.,2.4);',
    ' float dist=mix(3.15-.45*smoothstep(0.,10.,T),3.55*(1.+(por-1.)*.22),k);',
    ' vec3 cible=vec3(0.,0.,mix(0.,.38,k));',
    ' vec3 ro=cible+dist*vec3(sin(th)*cos(az),sin(th)*sin(az),cos(th));',
    ' ro.z+=M.y*.15*k;',
    ' vec3 fw=normalize(cible-ro);',
    ' vec3 rt=normalize(vec3(-sin(az),cos(az),0.));',
    ' vec3 up=cross(rt,fw);',
    ' vec3 rd=normalize(fw*1.6+uv.x*rt+uv.y*up);',
    // --- lancer de rayon sur le relief ---
    ' float t=.05,tp=.05;bool touche=false;float tmax=14.;',
    ' for(int i=0;i<190;i++){vec3 q=ro+rd*t;float hq=q.z-Z(q.xy);',
    '  if(hq<0.){touche=true;break;}',
    '  tp=t;t+=max(.003*t,hq*.38);if(t>tmax)break;}',
    ' if(touche){float a0=tp,a1=t;for(int j=0;j<6;j++){float m=.5*(a0+a1);vec3 q=ro+rd*m;if(q.z-Z(q.xy)<0.)a1=m;else a0=m;}t=.5*(a0+a1);}',
    ' float aube=smoothstep(1.5,9.5,T);',
    ' vec3 c;',
    ' if(touche){',
    '  vec3 p=ro+rd*t;float h=H(p.xy);',
    '  float e=.004;',
    '  vec3 n=normalize(vec3(Z(p.xy-vec2(e,0.))-Z(p.xy+vec2(e,0.)),Z(p.xy-vec2(0.,e))-Z(p.xy+vec2(0.,e)),2.*e));',
    '  float N=26.;float f=h*N;float fwd=max(fwidth(f),1e-4);',
    '  float dl=abs(fract(f-.5)-.5)/fwd;float l1=1.-smoothstep(.0,.9,dl);',
    '  float f5=h*N/5.;float fw5=max(fwidth(f5),1e-4);float d5=abs(fract(f5-.5)-.5)/fw5;float l5=1.-smoothstep(.2,1.8,d5);',
    '  float dens=1.-smoothstep(.35,.9,fwd);l1*=dens;l5*=1.-smoothstep(.6,1.4,fw5*5.);',  // évite le moiré au loin
    '  float seuil=mix(1.55,.34,aube);',
    '  float lumi=smoothstep(seuil-.02,seuil+.22,h);',
    '  float front=exp(-pow((h-seuil)*7.,2.))*smoothstep(.0,.15,aube)*(1.-smoothstep(.9,1.,aube)*.35);',
    '  vec3 sol=normalize(vec3(.75,.35,.55));float lam=clamp(dot(n,sol),0.,1.);',
    '  float lamV=mix(clamp(dot(n,normalize(vec3(.55,.62,.55))),0.,1.),lam,k);',
    '  vec3 fond=mix(vec3(.012,.02,.045),vec3(.05,.065,.12),lamV);',
    '  fond=mix(fond,mix(vec3(.10,.06,.09),vec3(.48,.26,.19),lamV),lumi*mix(.55,.8,k));',
    '  vec3 froid=vec3(.22,.32,.58);',
    '  vec3 chaud=mix(vec3(.98,.62,.40),vec3(1.,.93,.80),smoothstep(.6,1.4,h));',
    '  vec3 lc=mix(froid,chaud,lumi);',
    '  float apparition=smoothstep(.0,2.2,T-length(uv)*1.1);',
    '  float a=(l1*.34+l5*.62)*apparition*mix(.55,1.,lumi);',
    '  c=fond*apparition+lc*a;',
    '  c+=vec3(1.,.7,.45)*front*(.25+l1*.9+l5);',
    '  float brume=smoothstep(3.5,12.,t)*k;',
    '  c=mix(c,ciel(rd,aube),brume);',
    ' } else { c=ciel(rd,aube)*k; }',
    // halo du soleil levant (vue du dessus), puis vignettage
    ' c+=vec3(1.,.55,.32)*aube*(1.-k)*exp(-length(uv-vec2(.95,.75))*1.6)*.35;',
    ' c*=1.-.35*smoothstep(.6,1.4,length(uv*vec2(.8,1.)));',
    ' c+=(h21(gl_FragCoord.xy+T)-.5)/255.;',
    ' FRAG=vec4(c,1.);}'
  ].join('\n');

  function sh(t,s){ var o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(o)); return null;} return o; }
  var vs=sh(gl.VERTEX_SHADER,VS), fs=sh(gl.FRAGMENT_SHADER,FS); if(!vs||!fs) return;
  var pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.linkProgram(pr); if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var uR=gl.getUniformLocation(pr,'R'), uT=gl.getUniformLocation(pr,'T'), uM=gl.getUniformLocation(pr,'M');

  // Le relief en 3D est plus coûteux : résolution adaptée à l'appareil, et baisse automatique si ça rame
  var mobile=Math.min(innerWidth,innerHeight)<700;
  var echelle=mobile?.85:1;
  function taille(){ var dpr=Math.min(window.devicePixelRatio||1,mobile?2:1.5)*echelle; cv.width=Math.round(cv.clientWidth*dpr); cv.height=Math.round(cv.clientHeight*dpr); gl.viewport(0,0,cv.width,cv.height); }
  taille(); addEventListener('resize',taille);

  var reduit=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var params=new URLSearchParams(location.search), tFixe=params.has('t')?parseFloat(params.get('t')):null;
  var T0=performance.now(), souris=[0,0], cible=[0,0], lents=0, dernier=T0;
  addEventListener('pointermove',function(e){ cible=[e.clientX/innerWidth-.5, .5-e.clientY/innerHeight]; });

  function frame(now){
    var t=reduit?9.5:(tFixe!=null?tFixe:(now-T0)/1000);
    var dt=now-dernier; dernier=now;
    if(dt>40 && t>1){ if(++lents>15 && echelle>.4){ echelle*=.75; lents=0; taille(); } } else if(lents>0) lents--;
    souris[0]+=(cible[0]-souris[0])*.03; souris[1]+=(cible[1]-souris[1])*.03;
    gl.uniform2f(uR,cv.width,cv.height); gl.uniform1f(uT,t); gl.uniform2f(uM,souris[0],souris[1]);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(!reduit) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
