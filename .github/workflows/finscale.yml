name: Données Finscale
# Copie quotidienne des sujets et des invités (archive publique des épisodes) pour la page d'accueil.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths: ['tools/finscale.mjs', 'tools/invites-parse.js', '.github/workflows/finscale.yml']
permissions:
  contents: write
jobs:
  donnees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/finscale.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/finscale.json
          git diff --cached --quiet || git commit -m "Données Finscale du jour"
          git pull --rebase origin main && git push
